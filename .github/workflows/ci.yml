name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Configure test temporary directory
        shell: bash
        run: echo "TMPDIR=${RUNNER_TEMP}/" >> "$GITHUB_ENV"

      - name: Verify runner architecture
        shell: bash
        run: |
          runner_arch="$(uname -m)"
          echo "Runner architecture: ${runner_arch}"
          test "$runner_arch" = arm64

      - name: Configure Release build
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          clang="$(xcrun --sdk macosx --find clang)"
          clangxx="$(xcrun --sdk macosx --find clang++)"
          cmake -S . -B build/ci \
            -DCMAKE_BUILD_TYPE=Release \
            -DWFS_FSKIT=OFF \
            -DCMAKE_C_COMPILER="$clang" \
            -DCMAKE_CXX_COMPILER="$clangxx" \
            -DCMAKE_OSX_SYSROOT="$sdk" \
            -DSQLite3_INCLUDE_DIR="$sdk/usr/include" \
            -DSQLite3_LIBRARY="$sdk/usr/lib/libsqlite3.tbd"

      - name: Build
        run: cmake --build build/ci --parallel

      - name: Run CTest
        run: ctest --test-dir build/ci --output-on-failure --timeout 600 --no-tests=error

      - name: Test disk-full wrapper cleanup paths
        run: PYTHONPATH=scripts/tests python3 -m unittest discover -s scripts/tests -p 'test_disk_full_wrapper.py'

      - name: Run bounded APFS disk-full regression
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tests/disk_full.py build/ci 2>&1 | tee build/ci/disk-full.log

      - name: Check linked dependencies
        run: scripts/check-deps.sh build/ci

      - name: Run safety tests
        shell: bash
        run: |
          set -euo pipefail
          scripts/tests/safety.sh build/ci "${RUNNER_TEMP}/forkfs-ci/m1test" 2>&1 | tee build/ci/safety.log

      - name: Upload failure logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ci-failure-logs
          if-no-files-found: ignore
          path: |
            build/ci/Testing/Temporary/*.log
            build/ci/safety.log
            build/ci/disk-full.log

  linux:
    name: Release (Linux ${{ matrix.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - fs: xfs
            label: XFS
          - fs: btrfs
            label: Btrfs
          - fs: ext4
            label: ext4
    env:
      TEST_FS: ${{ matrix.fs }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install build and namespace tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 libsqlite3-dev xfsprogs btrfs-progs e2fsprogs bubblewrap
      - name: Allow Bubblewrap user namespaces under Ubuntu AppArmor
        run: |
          # Ubuntu 24.04's AppArmor policy requires an explicit profile for unprivileged userns.
          cat <<'EOF' | sudo tee /etc/apparmor.d/bwrap >/dev/null
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
      - name: Create bounded filesystem test volumes
        run: |
          set -euo pipefail
          truncate -s 2G "$RUNNER_TEMP/forkfs-test.img"
          sudo mkdir -p /mnt/forkfs-test
          if [ "$TEST_FS" = btrfs ]; then
            mkfs.btrfs -f -n 16384 "$RUNNER_TEMP/forkfs-test.img"
            sudo mount -o loop,user_subvol_rm_allowed "$RUNNER_TEMP/forkfs-test.img" /mnt/forkfs-test
            truncate -s 2G "$RUNNER_TEMP/forkfs-other.img"
            mkfs.btrfs -f -n 16384 "$RUNNER_TEMP/forkfs-other.img"
            sudo mkdir -p /mnt/forkfs-other
            sudo mount -o loop,user_subvol_rm_allowed "$RUNNER_TEMP/forkfs-other.img" /mnt/forkfs-other
            sudo chown "$(id -u):$(id -g)" /mnt/forkfs-other
            echo 'WFS_BTRFS_OTHER=/mnt/forkfs-other' >> "$GITHUB_ENV"
          elif [ "$TEST_FS" = ext4 ]; then
            truncate -s 1536M "$RUNNER_TEMP/forkfs-other.img"
            mkfs.ext4 -F -m 0 "$RUNNER_TEMP/forkfs-other.img"
            sudo mkdir -p /mnt/forkfs-other
            sudo mount -o loop "$RUNNER_TEMP/forkfs-other.img" /mnt/forkfs-other
            sudo chown "$(id -u):$(id -g)" /mnt/forkfs-other
            mkfs.ext4 -F "$RUNNER_TEMP/forkfs-test.img"
            sudo mount -o loop "$RUNNER_TEMP/forkfs-test.img" /mnt/forkfs-test
          else
            mkfs.xfs -f -m reflink=1 "$RUNNER_TEMP/forkfs-test.img"
            sudo mount -o loop "$RUNNER_TEMP/forkfs-test.img" /mnt/forkfs-test
          fi
          sudo chown "$(id -u):$(id -g)" /mnt/forkfs-test
      - name: Build and test as an unprivileged user
        run: |
          set -euo pipefail
          cmake -S . -B /mnt/forkfs-test/build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 -DWFS_FSKIT=OFF -DWFS_LINUX_TEST_FS="$TEST_FS"
          cmake --build /mnt/forkfs-test/build --parallel 4
          ctest --test-dir /mnt/forkfs-test/build --output-on-failure --no-tests=error
          scripts/check-deps.sh /mnt/forkfs-test/build
      - name: Test ext4 disk-full rollback and retry
        if: matrix.fs == 'ext4'
        run: python3 scripts/tests/linux_ext4_full.py /mnt/forkfs-test/build/cli/world --scratch /mnt/forkfs-other
      - name: Unmount test volume
        if: always()
        run: |
          if mountpoint -q /mnt/forkfs-test; then sudo umount /mnt/forkfs-test; fi
          if mountpoint -q /mnt/forkfs-other; then sudo umount /mnt/forkfs-other; fi
