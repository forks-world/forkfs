name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  revision-runtime:
    name: Revision runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Initialize storage dependency
        run: git submodule update --init third_party/leveldb
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y g++-14 libssl-dev
      - name: Configure Release
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-14
          else
            sdk="$(xcrun --sdk macosx --show-sdk-path)"
            cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER="$(xcrun --sdk macosx --find clang)" \
              -DCMAKE_CXX_COMPILER="$(xcrun --sdk macosx --find clang++)" \
              -DCMAKE_OSX_SYSROOT="$sdk" -DWFS_FSKIT=ON
          fi
      - name: Build
        run: cmake --build build/ci --parallel 4
      - name: Test revision runtime
        run: ctest --test-dir build/ci --output-on-failure --no-tests=error
      - name: Check linked dependencies
        run: scripts/check-deps.sh build/ci
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: failure-${{ matrix.os }}
          if-no-files-found: ignore
          path: build/ci/Testing/Temporary/*.log
